name: corpmove_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Estilo ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # --- Gestión de Estado & Lógica ---
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.6.0

  # --- Backend & Base de Datos (Firebase) ---
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.0

  # --- Servicios de Mapas ---
  google_maps_flutter: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/map_grid.png