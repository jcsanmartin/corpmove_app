name: corpmove_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Estilo ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # --- Gestión de Estado & Lógica ---
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.6.0
  provider: ^6.1.2  # Agregado según tu solicitud

  # --- Backend & Base de Datos (Firebase - Auth) ---
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1      # Autenticación (mantener)
  cloud_firestore: ^5.6.2    # Solo para auth/rol de usuarios en migración
  google_sign_in: ^6.2.2     # Login con Google

  # --- Backend & Base de Datos (Supabase - Datos + Storage) ---
  supabase_flutter: ^2.8.4

  # --- Servicios de Mapas ---
  google_maps_flutter: ^2.10.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.1
  mapbox_maps_flutter: 2.22.0
  geolocator: ^14.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/map_grid.png
    - assets/images/